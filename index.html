<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Language as Palimpsest</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Noto+Serif:ital,wght@0,400;0,700;1,400&family=Source+Sans+3:wght@400;600;700&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --nyt-bg: #ffffff;
    --nyt-text: #121212;
    --nyt-gray: #999999;
    --nyt-light-gray: #f7f7f7;
    --nyt-border: #e2e2e2;
    --nyt-accent: #326891;
    --nyt-highlight: #ffefcf;
    --japan-color: #c23b22;
    --romania-color: #003da5;
    --serif: 'Noto Serif', Georgia, serif;
    --sans: 'Source Sans 3', 'Helvetica Neue', Arial, sans-serif;
    --jp: 'Noto Sans JP', sans-serif;
  }

  html { scroll-behavior: smooth; }

  body {
    font-family: var(--serif);
    color: var(--nyt-text);
    background: var(--nyt-bg);
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }

  /* ── HEADER ── */
  .masthead {
    text-align: center;
    padding: 2rem 1rem 1rem;
    border-bottom: 2px solid var(--nyt-text);
    font-family: var(--sans);
    font-size: 0.7rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--nyt-gray);
  }

  .hero {
    max-width: 720px;
    margin: 0 auto;
    padding: 3rem 1.5rem 2rem;
    text-align: center;
  }

  .hero h1 {
    font-family: var(--serif);
    font-size: clamp(2.4rem, 5vw, 3.6rem);
    font-weight: 700;
    line-height: 1.15;
    margin-bottom: 1rem;
  }

  .hero .subtitle {
    font-family: var(--serif);
    font-style: italic;
    font-size: 1.25rem;
    color: #555;
    margin-bottom: 1.5rem;
  }

  .hero .tagline {
    font-family: var(--sans);
    font-size: 0.95rem;
    color: var(--nyt-gray);
    max-width: 540px;
    margin: 0 auto;
    line-height: 1.6;
  }

  .divider {
    width: 80px;
    height: 2px;
    background: var(--nyt-text);
    margin: 2rem auto;
  }

  /* ── PLACEHOLDER IMAGES ── */
  .placeholder-img {
    display: block;
    max-width: 420px;
    width: 100%;
    margin: 0 auto;
    border-radius: 6px;
  }

  .img-section {
    text-align: center;
    padding: 1rem 1.5rem;
  }

  /* ── SCROLLY LAYOUT ── */
  .scrolly {
    position: relative;
    display: flex;
    max-width: 1200px;
    margin: 0 auto;
  }

  /* Sticky left panel */
  .scrolly-sticky {
    position: sticky;
    top: 0;
    width: 55%;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 1rem;
    z-index: 1;
  }

  /* L/R toggle */
  .side-toggle {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 1.5rem;
    margin-bottom: 0.75rem;
    font-family: var(--sans);
  }

  .side-toggle .country-tab {
    font-weight: 700;
    font-size: 1rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    cursor: pointer;
    transition: opacity 0.3s ease;
    padding: 0.25rem 0;
    border: none;
    background: none;
    border-bottom: 2px solid transparent;
  }

  .side-toggle .country-tab.romania { color: var(--romania-color); }
  .side-toggle .country-tab.japan { color: var(--japan-color); }

  .side-toggle .country-tab.inactive {
    opacity: 0.25;
    border-bottom-color: transparent;
  }

  .side-toggle .country-tab.active {
    opacity: 1;
  }

  .side-toggle .country-tab.active.romania {
    border-bottom-color: var(--romania-color);
  }

  .side-toggle .country-tab.active.japan {
    border-bottom-color: var(--japan-color);
  }

  .side-toggle .toggle-divider {
    color: var(--nyt-border);
    font-size: 1.2rem;
    user-select: none;
  }

  /* Map */
  .sticky-map {
    width: 100%;
    max-width: 550px;
    height: 280px;
    position: relative;
    overflow: hidden;
    border-radius: 6px;
    background: var(--nyt-light-gray);
    margin-bottom: 0.75rem;
  }

  .sticky-map svg {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    transition: none;
  }

  .sticky-map svg:first-child path {
    fill: #e0e0e0;
    stroke: #fff;
    stroke-width: 0.3;
    transition: fill 0.4s ease;
  }

  .sticky-map svg:first-child path.highlight-japan {
    fill: var(--japan-color);
    fill-opacity: 0.75;
  }

  .sticky-map svg:first-child path.highlight-romania {
    fill: var(--romania-color);
    fill-opacity: 0.75;
  }

  .sticky-map svg:first-child path.highlight-source {
    fill: #f0c040;
    fill-opacity: 0.7;
  }

  .map-arrow-overlay {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
  }

  .map-arrow-overlay path, .map-arrow-overlay line {
    stroke-width: 2;
    stroke-dasharray: 6 3;
    animation: dash-flow 1.2s linear infinite;
  }

  .map-arrow-overlay .arrow-japan { stroke: var(--japan-color); }
  .map-arrow-overlay .arrow-romania { stroke: var(--romania-color); }
  .map-arrow-overlay circle { r: 3.5; }

  @keyframes dash-flow { to { stroke-dashoffset: -18; } }

  /* Word card in sticky */
  .sticky-word {
    width: 100%;
    max-width: 550px;
    text-align: center;
  }

  .sticky-word .card-era {
    font-family: var(--sans);
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: var(--nyt-gray);
  }

  .sticky-word .card-year {
    font-family: var(--serif);
    font-size: 1.6rem;
    font-weight: 700;
    margin-bottom: 0.3rem;
  }

  .sticky-word .card-layer {
    font-family: var(--sans);
    font-weight: 600;
    font-size: 0.95rem;
    margin-bottom: 0.5rem;
    padding-bottom: 0.4rem;
    border-bottom: 2px solid var(--nyt-border);
    display: inline-block;
  }

  .sticky-word .card-layer.japan { color: var(--japan-color); border-color: var(--japan-color); }
  .sticky-word .card-layer.romania { color: var(--romania-color); border-color: var(--romania-color); }

  .sticky-word .card-examples {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    justify-content: center;
    margin-bottom: 0.5rem;
  }

  .word-card {
    background: var(--nyt-light-gray);
    border-radius: 8px;
    padding: 0.6rem 1rem;
    min-width: 120px;
    transition: background 0.3s ease;
  }

  .word-card:hover { background: var(--nyt-highlight); }

  .word-card .script {
    font-family: var(--jp);
    font-size: 1.4rem;
    color: var(--japan-color);
    display: block;
  }

  .word-card .word {
    font-family: var(--serif);
    font-weight: 700;
    font-size: 1.1rem;
  }

  .word-card .origin-word {
    font-family: var(--sans);
    font-size: 0.7rem;
    color: var(--nyt-gray);
    font-style: italic;
  }

  .word-card .meaning {
    font-family: var(--sans);
    font-size: 0.75rem;
    color: var(--nyt-gray);
    display: block;
  }

  .word-card .note {
    font-family: var(--sans);
    font-size: 0.65rem;
    color: var(--nyt-gray);
    font-style: italic;
    display: block;
    margin-top: 0.2rem;
  }

  .no-examples {
    font-family: var(--sans);
    font-size: 0.8rem;
    color: var(--nyt-gray);
    font-style: italic;
  }

  /* Scroll steps (right column) */
  .scrolly-steps {
    width: 45%;
    position: relative;
    z-index: 2;
    padding: 0 2rem;
  }

  .step {
    min-height: 90vh;
    display: flex;
    align-items: center;
    padding: 2rem 0;
    opacity: 0.15;
    transition: opacity 0.5s ease;
  }

  .step.is-active { opacity: 1; }

  .step-card {
    background: rgba(255, 255, 255, 0.95);
    border: 1px solid var(--nyt-border);
    border-radius: 4px;
    padding: 1.5rem;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    max-width: 380px;
  }

  .step-card .era-tag {
    font-family: var(--sans);
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--nyt-gray);
    margin-bottom: 0.5rem;
  }

  .step-card h3 {
    font-family: var(--serif);
    font-size: 1.15rem;
    font-weight: 700;
    margin-bottom: 0.75rem;
    line-height: 1.35;
  }

  .step-card p {
    font-family: var(--serif);
    font-size: 0.95rem;
    color: #333;
    line-height: 1.65;
  }

  /* ── KAKI SECTION ── */
  .kaki-section {
    max-width: 720px;
    margin: 0 auto;
    padding: 3rem 1.5rem;
    text-align: center;
  }

  .kaki-section .kaki-char {
    font-family: var(--jp);
    font-size: 5rem;
    color: var(--japan-color);
    margin-bottom: 0.5rem;
  }

  .kaki-section .kaki-path {
    font-family: var(--sans);
    font-size: 1rem;
    color: var(--nyt-gray);
    letter-spacing: 0.15em;
    margin-bottom: 1.5rem;
  }

  .kaki-section p {
    font-family: var(--serif);
    font-size: 1.05rem;
    line-height: 1.7;
    max-width: 540px;
    margin: 0 auto;
  }

  /* ── NAV HINT ── */
  .nav-hint {
    position: fixed;
    bottom: 1.5rem;
    right: 1.5rem;
    font-family: var(--sans);
    font-size: 0.7rem;
    color: var(--nyt-gray);
    background: rgba(255,255,255,0.95);
    padding: 0.5rem 0.8rem;
    border-radius: 4px;
    border: 1px solid var(--nyt-border);
    z-index: 100;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }

  .nav-hint kbd {
    display: inline-block;
    padding: 0.1rem 0.4rem;
    border: 1px solid var(--nyt-border);
    border-radius: 3px;
    font-size: 0.65rem;
    background: var(--nyt-light-gray);
    margin: 0 0.1rem;
  }

  /* ── FOOTER ── */
  footer {
    text-align: center;
    padding: 3rem 1rem;
    border-top: 1px solid var(--nyt-border);
    font-family: var(--sans);
    font-size: 0.8rem;
    color: var(--nyt-gray);
  }

  /* ── RESPONSIVE ── */
  @media (max-width: 768px) {
    .scrolly { flex-direction: column; }
    .scrolly-sticky { width: 100%; height: 55vh; }
    .scrolly-steps { width: 100%; padding: 0 1rem; }
    .step { min-height: 60vh; }
    .sticky-map { height: 200px; }
  }
</style>
</head>
<body>

<!-- Hidden container for map bounding box calculations -->
<div id="map-offscreen" style="position:absolute;left:-9999px;top:-9999px;width:950px;height:620px;overflow:hidden;"></div>

<header class="masthead">Linguistic Palimpsest Project</header>

<section class="hero">
  <h1 id="hero-title">Language as Palimpsest</h1>
  <p class="subtitle" id="hero-subtitle">How empires shaped the words of Japan and Romania</p>
  <p class="tagline" id="hero-tagline"></p>
</section>

<div class="divider"></div>

<!-- PREAMBLE IMAGE -->
<section class="img-section">
  <img src="ruxie.jpeg" alt="Preamble" class="placeholder-img">
</section>

<div class="divider"></div>

<!-- SCROLLYTELLING -->
<section class="scrolly" id="scrolly">
  <!-- Sticky left panel -->
  <div class="scrolly-sticky">
    <div class="side-toggle">
      <button class="country-tab romania" id="tab-romania">Romania</button>
      <span class="toggle-divider">|</span>
      <button class="country-tab japan" id="tab-japan">Japan</button>
    </div>
    <div class="sticky-map" id="sticky-map"></div>
    <div class="sticky-word" id="sticky-word"></div>
  </div>

  <!-- Scroll steps (right column) -->
  <div class="scrolly-steps" id="scrolly-steps"></div>
</section>

<div class="divider"></div>

<!-- KAKI INTERLUDE -->
<section class="kaki-section">
  <div class="kaki-char" id="kaki-char"></div>
  <div class="kaki-path" id="kaki-path"></div>
  <p id="kaki-note"></p>
</section>

<div class="divider"></div>

<!-- POSTAMBLE IMAGE -->
<section class="img-section">
  <img src="yippe_unicorn_rainbow.jpg" alt="Postamble" class="placeholder-img">
</section>

<footer>
  <p>A preliminary visualization. Data and narrative subject to revision.</p>
</footer>

<div class="nav-hint">
  Scroll <kbd>&uarr;</kbd><kbd>&darr;</kbd> through time &nbsp;&middot;&nbsp;
  <kbd>&larr;</kbd><kbd>&rarr;</kbd> or click to switch
</div>

<script>
(async function () {
  // ── Load data + map ──
  const [dataRes, mapText] = await Promise.all([
    fetch('./data.json'),
    fetch('./world-map.svg').then(r => r.text())
  ]);
  const DATA = await dataRes.json();

  // ── Populate hero + kaki ──
  document.getElementById('hero-title').textContent = DATA.meta.title;
  document.getElementById('hero-subtitle').textContent = DATA.meta.subtitle;
  document.getElementById('hero-tagline').textContent = DATA.meta.tagline;
  document.getElementById('kaki-char').textContent = DATA.kaki.word;
  document.getElementById('kaki-path').textContent = DATA.kaki.path;
  document.getElementById('kaki-note').textContent = DATA.kaki.note;

  // ── Parse map SVG into offscreen container for getBBox ──
  const offscreen = document.getElementById('map-offscreen');
  offscreen.innerHTML = mapText;
  const refSvg = offscreen.querySelector('svg');
  refSvg.style.width = '950px';
  refSvg.style.height = '620px';

  // ── Constants ──
  const JAPAN_IDS = ['hokkaido', 'honshu', 'shikoku', 'kyushu'];
  const ROMANIA_ID = 'romania';
  const COLS = ['romania', 'japan'];
  const ERAS = DATA.eras;

  // All US territory IDs to highlight when America is involved
  const US_ALL = ['usa', 'alaska', 'alaska-westcopy', 'hawaii',
    'adak', 'adak west', 'attu', 'attu west', 'amchitka', 'amchitka west',
    'unalaska', 'unalaska west', 'umnak', 'umnak west',
    'st. lawrence island', 'st. lawrence island west'];

  // SOURCE_MAP: each era+side has `highlight` (countries to color gold)
  // and `arrowFrom` (countries to draw arrows FROM toward the destination)
  const SOURCE_MAP = {
    'prehistory': {
      japan:   { highlight: [], arrowFrom: [] },
      romania: { highlight: [], arrowFrom: [] }
    },
    '5th-century': {
      japan:   { highlight: ['china'], arrowFrom: ['china'] },
      romania: { highlight: ['bulgaria', 'serbia', 'croatia', 'bosnia', 'slovenia', 'macedonia', 'montenegro'], arrowFrom: ['bulgaria', 'serbia', 'croatia'] }
    },
    '15th-century': {
      japan:   { highlight: ['china'], arrowFrom: ['china'] },
      romania: { highlight: ['turkey'], arrowFrom: ['turkey'] }
    },
    '17th-century': {
      japan:   { highlight: ['portugal', 'netherlands'], arrowFrom: ['portugal', 'netherlands'] },
      romania: { highlight: ['germany', 'austria', 'hungary'], arrowFrom: ['germany', 'austria', 'hungary'] }
    },
    '19th-century': {
      japan:   { highlight: ['britain', 'germany'], arrowFrom: ['britain', 'germany'] },
      romania: { highlight: ['france'], arrowFrom: ['france'] }
    },
    '20th-century': {
      japan:   { highlight: US_ALL, arrowFrom: ['usa'] },
      romania: { highlight: ['russia'], arrowFrom: ['russia'] }
    },
    '21st-century': {
      japan:   { highlight: US_ALL, arrowFrom: ['usa'] },
      romania: { highlight: US_ALL, arrowFrom: ['usa'] }
    }
  };

  // ── getBBox helper on reference SVG ──
  function getRefBBox(id) {
    const el = refSvg.getElementById(id);
    if (!el) return null;
    try { return el.getBBox(); } catch(e) { return null; }
  }

  function getRefCenter(id) {
    const bb = getRefBBox(id);
    if (!bb) return null;
    return { x: bb.x + bb.width / 2, y: bb.y + bb.height / 2 };
  }

  function getRefGroupCenter(ids) {
    const centers = ids.map(getRefCenter).filter(Boolean);
    if (!centers.length) return null;
    return {
      x: centers.reduce((s, c) => s + c.x, 0) / centers.length,
      y: centers.reduce((s, c) => s + c.y, 0) / centers.length
    };
  }

  // ── Compute dynamic viewBox to fit all given country IDs ──
  function computeViewBox(countryIds) {
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    let found = 0;

    countryIds.forEach(id => {
      const bb = getRefBBox(id);
      if (!bb) return;
      found++;
      minX = Math.min(minX, bb.x);
      minY = Math.min(minY, bb.y);
      maxX = Math.max(maxX, bb.x + bb.width);
      maxY = Math.max(maxY, bb.y + bb.height);
    });

    if (found === 0) return { x: 0, y: 0, w: 950, h: 620 }; // fallback full map

    let w = maxX - minX;
    let h = maxY - minY;

    // Add 20% padding
    const padX = w * 0.2;
    const padY = h * 0.2;
    minX -= padX;
    minY -= padY;
    w += padX * 2;
    h += padY * 2;

    // Enforce minimum size so tiny countries aren't over-zoomed
    const MIN_SIZE = 120;
    if (w < MIN_SIZE) { const diff = MIN_SIZE - w; minX -= diff/2; w = MIN_SIZE; }
    if (h < MIN_SIZE) { const diff = MIN_SIZE - h; minY -= diff/2; h = MIN_SIZE; }

    // Clamp to map bounds
    minX = Math.max(0, minX);
    minY = Math.max(0, minY);
    if (minX + w > 950) w = 950 - minX;
    if (minY + h > 620) h = 620 - minY;

    return { x: minX, y: minY, w, h };
  }

  // ── Animated viewBox interpolation ──
  let currentVB = { x: 0, y: 0, w: 950, h: 620 };
  let animFrame = null;

  function animateViewBox(targetVB, mapSvg, arrowSvg, duration) {
    if (animFrame) cancelAnimationFrame(animFrame);

    const startVB = { ...currentVB };
    const startTime = performance.now();

    function tick(now) {
      const t = Math.min(1, (now - startTime) / duration);
      const ease = t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t; // easeInOutQuad

      const vb = {
        x: startVB.x + (targetVB.x - startVB.x) * ease,
        y: startVB.y + (targetVB.y - startVB.y) * ease,
        w: startVB.w + (targetVB.w - startVB.w) * ease,
        h: startVB.h + (targetVB.h - startVB.h) * ease
      };

      const vbStr = `${vb.x} ${vb.y} ${vb.w} ${vb.h}`;
      mapSvg.setAttribute('viewBox', vbStr);
      arrowSvg.setAttribute('viewBox', vbStr);
      currentVB = vb;

      if (t < 1) {
        animFrame = requestAnimationFrame(tick);
      } else {
        currentVB = targetVB;
      }
    }

    animFrame = requestAnimationFrame(tick);
  }

  // ── State ──
  let col = 0; // 0=romania, 1=japan
  let currentEraIndex = 0;

  // ── Build persistent map SVGs in the sticky panel ──
  const stickyMap = document.getElementById('sticky-map');
  const parser = new DOMParser();
  const mapDoc = parser.parseFromString(mapText, 'image/svg+xml');
  const mapSvg = mapDoc.documentElement;
  mapSvg.removeAttribute('width');
  mapSvg.removeAttribute('height');
  mapSvg.setAttribute('viewBox', '0 0 950 620');
  mapSvg.setAttribute('preserveAspectRatio', 'xMidYMid meet');
  mapSvg.style.width = '100%';
  mapSvg.style.height = '100%';
  stickyMap.appendChild(mapSvg);

  const ns = 'http://www.w3.org/2000/svg';

  const arrowSvg = document.createElementNS(ns, 'svg');
  arrowSvg.classList.add('map-arrow-overlay');
  arrowSvg.setAttribute('viewBox', '0 0 950 620');
  arrowSvg.setAttribute('preserveAspectRatio', 'xMidYMid meet');
  stickyMap.appendChild(arrowSvg);

  // ── Render the sticky panel for current era + side ──
  function renderSticky(eraIndex, animate) {
    const era = ERAS[eraIndex];
    const side = COLS[col];
    const sideData = era[side];
    const sourceData = (SOURCE_MAP[era.id] || {})[side] || { highlight: [], arrowFrom: [] };
    const highlightIds = sourceData.highlight;
    const arrowFromIds = sourceData.arrowFrom;

    // Tab states
    const tabRo = document.getElementById('tab-romania');
    const tabJp = document.getElementById('tab-japan');
    tabRo.className = `country-tab romania ${side === 'romania' ? 'active' : 'inactive'}`;
    tabJp.className = `country-tab japan ${side === 'japan' ? 'active' : 'inactive'}`;

    // ── Map highlights ──
    mapSvg.querySelectorAll('path').forEach(p => {
      p.classList.remove('highlight-japan', 'highlight-romania', 'highlight-source');
    });

    // Only highlight the active side's destination
    if (side === 'japan') {
      JAPAN_IDS.forEach(id => {
        const el = mapSvg.getElementById(id);
        if (el) el.classList.add('highlight-japan');
      });
    } else {
      const ro = mapSvg.getElementById(ROMANIA_ID);
      if (ro) ro.classList.add('highlight-romania');
    }

    // Highlight source countries (all of them, including decorative ones like hawaii)
    highlightIds.forEach(id => {
      const el = mapSvg.getElementById(id);
      if (el) el.classList.add('highlight-source');
    });

    // ── Compute dynamic viewBox ──
    const destIds = side === 'japan' ? [...JAPAN_IDS] : [ROMANIA_ID];
    const zoomIds = [...destIds, ...arrowFromIds];
    const targetVB = computeViewBox(zoomIds);

    if (animate) {
      animateViewBox(targetVB, mapSvg, arrowSvg, 400);
    } else {
      const vbStr = `${targetVB.x} ${targetVB.y} ${targetVB.w} ${targetVB.h}`;
      mapSvg.setAttribute('viewBox', vbStr);
      arrowSvg.setAttribute('viewBox', vbStr);
      currentVB = targetVB;
    }

    // ── Arrows (only from arrowFrom countries, not all highlights) ──
    arrowSvg.innerHTML = '';
    const destCenter = side === 'japan' ? getRefGroupCenter(JAPAN_IDS) : getRefCenter(ROMANIA_ID);
    const arrowCls = side === 'japan' ? 'arrow-japan' : 'arrow-romania';
    const arrowFill = side === 'japan' ? 'var(--japan-color)' : 'var(--romania-color)';

    arrowFromIds.forEach(srcId => {
      const srcCenter = getRefCenter(srcId);
      if (srcCenter && destCenter) {
        // Draw a curved arc that bows upward
        const midX = (srcCenter.x + destCenter.x) / 2;
        const dist = Math.hypot(destCenter.x - srcCenter.x, destCenter.y - srcCenter.y);
        const bow = dist < 100 ? dist * 0.05 : dist * 0.15; // subtle for short, pronounced for long
        const midY = Math.min(srcCenter.y, destCenter.y) - bow;

        const path = document.createElementNS(ns, 'path');
        path.setAttribute('d', `M${srcCenter.x},${srcCenter.y} Q${midX},${midY} ${destCenter.x},${destCenter.y}`);
        path.setAttribute('fill', 'none');
        path.classList.add(arrowCls);
        arrowSvg.appendChild(path);

        const dot = document.createElementNS(ns, 'circle');
        dot.setAttribute('cx', destCenter.x);
        dot.setAttribute('cy', destCenter.y);
        dot.setAttribute('fill', arrowFill);
        arrowSvg.appendChild(dot);
      }
    });

    // ── Word content ──
    const wordEl = document.getElementById('sticky-word');
    const examples = sideData.examples || [];

    let exHtml = '';
    if (examples.length > 0) {
      exHtml = '<div class="card-examples">' + examples.map(ex => `
        <div class="word-card">
          ${ex.script ? `<span class="script">${ex.script}</span>` : ''}
          <span class="word">${ex.word}</span>
          ${ex.origin ? `<span class="origin-word">&larr; ${ex.origin}</span>` : ''}
          <span class="meaning">${ex.meaning}</span>
          ${ex.note ? `<span class="note">${ex.note}</span>` : ''}
        </div>
      `).join('') + '</div>';
    } else {
      exHtml = '<p class="no-examples">Word examples to be added</p>';
    }

    wordEl.innerHTML = `
      <div class="card-era">${era.period}</div>
      <div class="card-year">${era.yearLabel}</div>
      <div class="card-layer ${side}">${sideData.layer}</div>
      ${exHtml}
    `;
  }

  // ── Build scroll steps ──
  const stepsContainer = document.getElementById('scrolly-steps');
  ERAS.forEach((era, i) => {
    const step = document.createElement('div');
    step.className = 'step';
    step.dataset.index = i;
    step.innerHTML = `
      <div class="step-card">
        <div class="era-tag">${era.period} &middot; ${era.yearLabel}</div>
        <h3>${era.japan.layer} &harr; ${era.romania.layer}</h3>
        <p>${era.context}</p>
      </div>
    `;
    stepsContainer.appendChild(step);
  });

  // ── IntersectionObserver for scrolling through eras ──
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        const idx = parseInt(entry.target.dataset.index);
        if (idx !== currentEraIndex) {
          currentEraIndex = idx;
          renderSticky(idx, true);
        }

        document.querySelectorAll('.step').forEach(s => s.classList.remove('is-active'));
        entry.target.classList.add('is-active');
      }
    });
  }, {
    root: null,
    rootMargin: '-30% 0px -30% 0px',
    threshold: 0.1
  });

  document.querySelectorAll('.step').forEach(step => observer.observe(step));

  // ── Left/Right navigation ──
  function switchSide(dc) {
    const newCol = col + dc;
    if (newCol >= 0 && newCol < COLS.length) {
      col = newCol;
      renderSticky(currentEraIndex, true);
    }
  }

  document.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    if (e.key === 'ArrowLeft')  { e.preventDefault(); switchSide(-1); }
    if (e.key === 'ArrowRight') { e.preventDefault(); switchSide(1); }
  });

  document.getElementById('tab-romania').addEventListener('click', () => { col = 0; renderSticky(currentEraIndex, true); });
  document.getElementById('tab-japan').addEventListener('click', () => { col = 1; renderSticky(currentEraIndex, true); });

  // ── Initial render ──
  renderSticky(0, false);
  document.querySelector('.step').classList.add('is-active');

})();
</script>

</body>
</html>
