<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quilted Languages</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Noto+Serif:ital,wght@0,400;0,700;1,400&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/story.css">
</head>
<body data-page="home">
  <script src="js/nav.js"></script>

  <section class="hero" id="home">
    <div class="hero-title">
      <h1>Quilted Languages</h1>
      <p class="tagline">How empires shaped the words of Romania and Japan</p>
    </div>
    <div class="hero-globe" id="hero-globe"></div>
    <a class="scroll-cue" href="#story">
      <span>Scroll to begin</span>
      <svg width="18" height="10" viewBox="0 0 18 10" aria-hidden="true"><path d="M1 1l8 8 8-8" fill="none" stroke="currentColor" stroke-width="2"/></svg>
    </a>
  </section>

  <section class="story side-romania" id="story">
    <div class="stage">
      <div class="globe-wrap">
        <div class="era-badge" aria-live="polite">
          <div class="era-period" id="era-period"></div>
          <div class="era-layer" id="era-layer"></div>
        </div>
        <div class="story-globe" id="story-globe"></div>
        <ol class="timeline" id="timeline" aria-label="Eras"></ol>
      </div>
    </div>
    <div class="steps" id="steps"></div>
  </section>

  <button class="side-toggle" id="side-toggle" type="button" aria-label="Switch to Japan">
    <span class="side-toggle-label" id="side-toggle-label">Japan</span>
    <svg class="tri" width="18" height="22" viewBox="0 0 18 22" aria-hidden="true"><path d="M2 2 L16 11 L2 20 Z" fill="currentColor"/></svg>
  </button>

  <footer class="site-footer">
    <p>Quilted Languages &middot; a prototype &middot; <a href="credits.html">Credits</a> &middot; <a href="resources.html">Resources</a></p>
  </footer>

  <script src="vendor/d3.min.js"></script>
  <script src="vendor/topojson-client.min.js"></script>
  <script src="js/globe.js"></script>
  <script src="js/story.js"></script>
</body>
</html>
